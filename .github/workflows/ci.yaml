name: AWG Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env: 
  DOCKER_CONTAINER_REGISTRY: ghcr.io
  
jobs:
  # magic-releaser (.magic-releaser.yaml) analyses the Conventional Commits of
  # main: a release bumps the images in compose.yaml, prepends CHANGELOG.md,
  # pushes the `chore(release): vX.Y.Z` commit with its tag and creates the
  # GitHub release, without a release pull request.
  release:
    runs-on: ubuntu-latest
    # The release commit lands on main and starts this workflow again
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') }}
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release
        id: release
        uses: yuki-nemurenai/magic-releaser@v1

      # The compose file of the release pins its images
      - name: Upload release assets
        if: ${{ steps.release.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout "$TAG"
          gh release upload "$TAG" compose.yaml .env.example --clobber

  build:
    name: Build ${{ matrix.IMAGE_NAME }}
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - DOCKERFILE: Dockerfile.api
            IMAGE_NAME: api
          - DOCKERFILE: Dockerfile.ui
            IMAGE_NAME: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_CONTAINER_REGISTRY }}/${{ github.repository }}/${{ matrix.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.version }}

      - name: Docker Build and Push
        env: 
          DOCKER_BUILD_SUMMARY: false
        uses: docker/build-push-action@v7
        with:
          # Built from the release tag, not from the commit that started the run
          context: .
          file: ${{ matrix.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
